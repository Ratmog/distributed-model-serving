name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.gpu.yaml config --quiet
      - run: docker build -t distributed-model-serving:ci .
