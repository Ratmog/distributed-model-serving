[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-model-serving"
version = "0.1.0"
description = "Bounded LLM inference gateway, leased Redis jobs, and reproducible evaluation"
requires-python = ">=3.11"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
 "redis>=5,<7", "prometheus-client>=0.21,<1",
 "opentelemetry-api>=1.28,<2", "opentelemetry-sdk>=1.28,<2",
 "opentelemetry-exporter-otlp-proto-http>=1.28,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "fakeredis[lua]>=2.26,<3", "ruff>=0.9,<1"]
eval = ["mlflow>=2.18,<4"]
[tool.setuptools.packages.find]
include = ["serving*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
